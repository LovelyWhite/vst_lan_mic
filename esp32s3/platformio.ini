; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-devkitc-1]
; Arduino 3.1.1, matching the version-scoped DWC2 workaround in main.cpp.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.11/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  https://github.com/pschatzmann/arduino-audio-tools.git#v1.3.0
  https://github.com/pschatzmann/codec-opus.git#v1.6.1
  tzapu/WiFiManager@2.0.17
board_build.partitions = ota_nofs_4MB.csv
board_build.arduino.memory_type = qio_qspi
board_upload.flash_size = 4MB
build_unflags =
  -DARDUINO_USB_MODE=1
  -std=gnu++11
  -Os
build_flags =
  -O2
  -DOPUS_XTENSA_ASM=1
  -DOPUS_HAVE_RTCD=0
  -DOPUS_FIXED_POINT=1
  ; USE_ALLOCA takes precedence over libopus config.h's shared pseudostack.
  -DUSE_ALLOCA=1
  -DHAVE_ALLOCA_H=1
  -std=gnu++17
  -I../common -I include
  -DARDUINO_USB_MODE=0
  -DARDUINO_USB_CDC_ON_BOOT=0
  -DBOARD_HAS_PSRAM
  -DCORE_DEBUG_LEVEL=0
  -DWM_STRINGS_FILE=\"my_strings_en.h\"
